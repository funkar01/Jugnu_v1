<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, shrink-to-fit=no"
    />
    <title>Jugnu XR | Immersive Sports by Rush XR Studios</title>
    <!-- Instant Mobile Redirect (Android/iOS) to Sticker WebAR, excluding Quest Headsets -->
    <script>
      (function() {
        const ua = navigator.userAgent;
        const isMobile = /Android|iPhone|iPad|iPod|Windows Phone|webOS/i.test(ua);
        const isHeadset = /Oculus|Quest|OculusBrowser|Pico|PicoBrowser|PicoVR|PicoHome/i.test(ua);
        if (isMobile && !isHeadset) {
          window.location.replace('./sticker.html');
          return;
        }
        window.isDesktopPC = !isMobile && !isHeadset;
        window.isXRHeadset = isHeadset;
      })();
    </script>
    <!-- Load Premium Typography -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Oxanium:wght@600;700;800&family=JetBrains+Mono:wght@400;500;700&family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
      body {
        margin: 0;
        overflow: hidden;
        background-color: #050818;
      }

      /* Landing Page Layout */
      #landing-page {
        position: absolute;
        top: 0;
        left: 0;
        width: 100vw;
        height: 100vh;
        pointer-events: none;
        z-index: 1000;
        font-family: 'Outfit', sans-serif;
        display: flex;
        align-items: center;
        padding-left: 5%;
        box-sizing: border-box;
        transition: opacity 0.5s ease;
      }

      /* Glassmorphic Container */
      .glass-card {
        width: 420px;
        background: rgba(8, 10, 28, 0.65);
        backdrop-filter: blur(16px);
        -webkit-backdrop-filter: blur(16px);
        border: 1px solid rgba(255, 122, 0, 0.25);
        border-radius: 20px;
        padding: 2.5rem;
        display: flex;
        flex-direction: column;
        gap: 1.5rem;
        box-shadow: 0 12px 40px 0 rgba(0, 0, 0, 0.6), inset 0 0 12px rgba(255, 122, 0, 0.05);
        pointer-events: auto;
        color: #f8fafc;
      }

      /* Telemetry Header */
      .header-row {
        display: flex;
        justify-content: space-between;
        align-items: center;
        border-bottom: 1px solid rgba(255, 255, 255, 0.08);
        padding-bottom: 0.8rem;
      }

      .status-beacon {
        display: flex;
        align-items: center;
        gap: 0.5rem;
        font-family: 'Space Grotesk', sans-serif;
        font-size: 0.75rem;
        text-transform: uppercase;
        letter-spacing: 1px;
        color: #ff7a00;
      }

      .beacon-dot {
        width: 8px;
        height: 8px;
        background-color: #ff7a00;
        border-radius: 50%;
        box-shadow: 0 0 10px #ff7a00;
        animation: pulseBeacon 2s infinite;
      }

      @keyframes pulseBeacon {
        0%, 100% { opacity: 0.4; }
        50% { opacity: 1; transform: scale(1.2); }
      }

      /* Title & Branding */
      .title-group {
        display: flex;
        flex-direction: column;
        gap: 0.2rem;
      }

      .main-title {
        background: linear-gradient(135deg, #ff7a00 0%, #ffb703 100%);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        font-weight: 800;
        font-size: 2.6rem;
        letter-spacing: -1.5px;
        text-transform: uppercase;
        margin: 0;
        line-height: 1.1;
      }

      .subtitle {
        color: #94a3b8;
        font-size: 0.95rem;
        font-weight: 300;
        line-height: 1.5;
        margin: 0;
      }

      /* Telemetry Box */
      .telemetry-box {
        background: rgba(0, 0, 0, 0.35);
        border: 1px solid rgba(255, 255, 255, 0.05);
        border-radius: 10px;
        padding: 1rem;
        font-family: 'Space Grotesk', monospace;
        font-size: 0.8rem;
        display: flex;
        flex-direction: column;
        gap: 0.5rem;
        letter-spacing: 0.2px;
      }

      .telemetry-row {
        display: flex;
        justify-content: space-between;
        color: #64748b;
      }

      .telemetry-val {
        color: #cbd5e1;
      }

      .telemetry-val.cyan {
        color: #ff7a00;
        font-weight: 500;
      }

      /* Action Buttons */
      .action-group {
        display: flex;
        flex-direction: column;
        gap: 0.8rem;
        margin-top: 0.5rem;
      }

      .btn-primary {
        background: linear-gradient(135deg, #ff7a00 0%, #f07d00 100%);
        color: #050818;
        font-weight: 600;
        padding: 1.1rem;
        border: none;
        border-radius: 10px;
        font-size: 1rem;
        cursor: pointer;
        transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
        box-shadow: 0 4px 15px rgba(255, 122, 0, 0.25);
        font-family: 'Space Grotesk', sans-serif;
        text-transform: uppercase;
        letter-spacing: 0.5px;
        display: flex;
        justify-content: center;
        align-items: center;
        gap: 0.5rem;
      }

      .btn-primary:hover {
        transform: translateY(-2px);
        box-shadow: 0 8px 25px rgba(255, 122, 0, 0.45);
        filter: brightness(1.08);
      }

      .btn-primary:active {
        transform: translateY(0);
      }

      .btn-primary:disabled {
        background: rgba(255, 255, 255, 0.08) !important;
        border: 1px solid rgba(255, 255, 255, 0.1) !important;
        color: #64748b !important;
        cursor: not-allowed;
        box-shadow: none !important;
        transform: none !important;
        filter: none !important;
      }

      .btn-primary .spinner {
        width: 16px;
        height: 16px;
        border: 2px solid rgba(255, 255, 255, 0.1);
        border-top-color: #ff7a00;
        border-radius: 50%;
        animation: spin 0.8s linear infinite;
        display: inline-block;
        margin-right: 8px;
      }

      @keyframes spin {
        to { transform: rotate(360deg); }
      }

      .btn-secondary {
        background: transparent;
        color: #ff00ff;
        border: 1px solid rgba(255, 0, 255, 0.4);
        font-weight: 600;
        padding: 1.1rem;
        border-radius: 10px;
        font-size: 1rem;
        cursor: pointer;
        transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
        font-family: 'Space Grotesk', sans-serif;

        letter-spacing: 0.5px;
      }

      .btn-secondary:hover {
        transform: translateY(-2px);
        border-color: #ff00ff;
        background: rgba(255, 0, 255, 0.08);
        box-shadow: 0 0 15px rgba(255, 0, 255, 0.2);
      }

      .btn-secondary:active {
        transform: translateY(0);
      }

      /* Float Cybernetic Labels */
      .footer-label {
        font-size: 0.7rem;
        color: #475569;
        text-transform: uppercase;
        letter-spacing: 1.5px;
        font-family: 'Space Grotesk', sans-serif;
        text-align: center;
        margin-top: 0.2rem;
      }

      /* Custom Toast Capsule */
      #toast-alert {
        position: absolute;
        top: 2rem;
        right: 2rem;
        background: rgba(8, 8, 28, 0.9);
        backdrop-filter: blur(12px);
        -webkit-backdrop-filter: blur(12px);
        border: 1px solid #ff7a00;
        color: #fff;
        padding: 0.9rem 1.6rem;
        border-radius: 10px;
        font-family: 'Space Grotesk', sans-serif;
        font-size: 0.9rem;
        font-weight: 500;
        pointer-events: none;
        opacity: 0;
        transform: translateY(-15px);
        transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
        box-shadow: 0 8px 24px rgba(255, 122, 0, 0.25);
        z-index: 1010;
        display: flex;
        align-items: center;
        gap: 0.6rem;
      }

      #toast-alert.show {
        opacity: 1;
        transform: translateY(0);
      }

      .toast-icon {
        color: #ff7a00;
        font-size: 1.1rem;
        font-weight: bold;
      }

      @media (max-height: 520px) {

        }
      }
    </style>
    <script>
      (function() {
        const isPC = window.isDesktopPC;
        const style = document.createElement('style');
        if (isPC) {
          style.innerHTML = `
            #root { display: block !important; }
            #landing-page { display: none !important; }
          `;
        } else {
          style.innerHTML = `
            #root { display: none !important; }
            #landing-page { display: flex !important; }
          `;
        }
        document.head.appendChild(style);
      })();
    </script>
  </head>
  <body>
    <div id="scene-container"></div>
    <div id="root"></div>

    <!-- Lightweight landing page overlay for VR/AR Headsets -->
    <div id="landing-page" style="display: none;">
      <div class="glass-card">
        <div class="header-row">
          <div class="status-beacon">
            <div class="beacon-dot"></div>
            <span>System Standby</span>
          </div>
          <span style="font-size: 0.75rem; color: #475569; font-family: 'Space Grotesk', sans-serif;">v0.1.0</span>
        </div>

        <div class="title-group">
          <h1 class="main-title">Jugnu Core</h1>
          <p class="subtitle">Next-gen holographic companion & spatial simulation workspace.</p>
        </div>

        <div class="telemetry-box">
          <div class="telemetry-row">
            <span>CORE STATUS:</span>
            <span class="telemetry-val cyan">ONLINE</span>
          </div>
          <div class="telemetry-row">
            <span>SHADERS:</span>
            <span id="shader-status-val" class="telemetry-val" style="color: #ff00ff; font-weight: 500;">COMPILING...</span>
          </div>
          <div class="telemetry-row">
            <span>COORDINATES:</span>
            <span class="telemetry-val">[0.0, 1.45, -0.8]</span>
          </div>
          <div class="telemetry-row">
            <span>XR HARDWARE:</span>
            <span class="telemetry-val">READY</span>
          </div>
        </div>

        <div class="action-group">
          <button id="enter-xr-btn" class="btn-primary" disabled>
            <div class="spinner"></div>
            <span>Compiling Shaders...</span>
          </button>
        </div>

        <div class="footer-label">Aim device or connect headset to initiate.</div>
      </div>
    </div>

    <!-- Styled Floating Alert Toast -->
    <div id="toast-alert" style="display: none;">
      <span class="toast-icon">⚡</span>
      <span id="toast-text">AR mode coming soon!</span>
    </div>

    <!-- Developer Testing HUD (Only displayed/active for testing layout modes on localhost) -->
    <div id="dev-hud" style="position: fixed; bottom: 20px; right: 20px; z-index: 9999; display: none; gap: 8px; background: rgba(15, 23, 42, 0.9); border: 1px solid rgba(239, 68, 68, 0.4); padding: 8px; border-radius: 8px; box-shadow: 0 4px 20px rgba(0,0,0,0.5); font-family: monospace;">
      <button onclick="forceDevLayout('pc')" style="background: rgba(239, 68, 68, 0.2); border: 1px solid #ef4444; color: #fff; padding: 4px 8px; border-radius: 4px; font-size: 10px; cursor: pointer;">[TEST PC PX]</button>
      <button onclick="forceDevLayout('xr')" style="background: rgba(168, 85, 247, 0.2); border: 1px solid #a855f7; color: #fff; padding: 4px 8px; border-radius: 4px; font-size: 10px; cursor: pointer;">[TEST XR QUEST]</button>
      <a href="./sticker.html" style="background: rgba(59, 130, 246, 0.2); border: 1px solid #3b82f6; color: #fff; padding: 4px 8px; border-radius: 4px; font-size: 10px; text-decoration: none; display: inline-block;">[TEST MOBILE AR]</a>
    </div>

    <script>
      function forceDevLayout(mode) {
        const rootEl = document.getElementById("root");
        const landingPageEl = document.getElementById("landing-page");
        if (mode === 'pc') {
          window.isDesktopPC = true;
          window.isXRHeadset = false;
          if (rootEl) rootEl.style.display = "block";
          if (landingPageEl) landingPageEl.style.display = "none";
        } else if (mode === 'xr') {
          window.isDesktopPC = false;
          window.isXRHeadset = true;
          if (rootEl) rootEl.style.display = "none";
          if (landingPageEl) landingPageEl.style.display = "flex";
        }
      }

      (function() {
        const isLocal = window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1' || window.location.protocol === 'file:';
        const hud = document.getElementById("dev-hud");
        if (hud) {
          hud.style.display = isLocal ? "flex" : "none";
        }
      })();
    </script>

    <script type="module" src="./src/main.tsx"></script>
    <script type="module" src="./src/index.ts"></script>
